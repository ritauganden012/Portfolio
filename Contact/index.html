<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Rita Uganden-Teryila</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/global.js"></script>
</head>
<body>
<main class="page">

  <section class="page-head">
    <h1>Contact</h1>
    <p>Open to roles and projects in Product Operations, Energy &amp; Data and Media Production. Write to me at <a href="mailto:rita.uganden@outlook.com">rita.uganden@outlook.com</a>, or use the form below.</p>
  </section>

  <form action="mailto:rita.uganden@outlook.com" method="GET" class="contact-form">
    <fieldset>
      <legend>Contact form</legend>
      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" required>
      <label for="body">Message</label>
      <textarea id="body" name="body" rows="6" required></textarea>
      <button class="button" type="submit">Open in my email app</button>
    </fieldset>
  </form>

  <div style="height: 72px;"></div>
</main>
</body>
</html>
